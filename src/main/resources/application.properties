spring.application.name=itic
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3311/db_ecomerce
#spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=api_user
spring.datasource.password=1234

# IMPORTANT: Activar l'execució dels scripts SQL
#spring.sql.init.mode=always

# SQL logging
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8085/login/oauth2/code/google
